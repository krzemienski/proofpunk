# CI gates for proofpunk — closes register item #13 ("no CI runs the gates").
#
# The orchestration DAG has drifted silently before; verify-orchestration.py
# caught it only because someone remembered to run it by hand. This workflow
# makes forgetting impossible: all seven gates run on every push and PR.
#
# Doctrine: never pipe a command whose exit code is reported. Every gate below
# runs unpiped as its own named step, so a failure names itself in the UI and
# the step's own exit code fails the job.
#
# All seven gates are hermetic: no network, no secrets, no external deps —
# bash + python3 (stdlib) + coreutils only. test-installer.sh and test-hooks.sh
# isolate themselves in mktemp scratch dirs and scratch HOMEs; every installer
# invocation in the harness passes a local --source-dir, so the installer's
# GitHub-download branch is never exercised here.
#
# NOT run here, deliberately: tools/sdk_probe.py. It drives a live Claude Agent
# SDK session, so it needs network and credentials and is neither hermetic nor
# deterministic. Its absence is a known coverage gap, not an oversight — no CI
# run exercises a live model session against this plugin. Recorded in
# evidence/v3-release/00-baseline/codebase-analysis.md rather than papered over.

name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Shell syntax check (bash -n over hooks and tools)
        run: |
          set -euo pipefail
          for f in plugins/proofpunk/hooks/*.sh tools/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: "Gate 1/7: verify-orchestration.py (skill graph DAG)"
        run: python3 tools/verify-orchestration.py

      - name: "Gate 2/7: test-hooks.sh (hook decision assertions)"
        run: bash tools/test-hooks.sh

      - name: "Gate 3/7: test-installer.sh (real installer harness)"
        run: bash tools/test-installer.sh

      - name: "Gate 4/7: dry-run-install.sh (slash-command merge logic)"
        run: bash tools/dry-run-install.sh

      # Repo-tree citation resolution. The installer's own --verify CANNOT see
      # these: it rewrites citations and bundles with an optional
      # `(references/)?` prefix, so a broken repo citation is repaired during
      # install and then verified in its repaired form. Default mode fails on
      # ERROR only (unresolved citation in a top-level SKILL.md); the 29 known
      # bundled-reference warns are a frozen baseline so growth cannot be silent.
      - name: "Gate 5/7: verify-citations.py (repo-tree citation resolution)"
        run: python3 tools/verify-citations.py

      # Meta-gate: every harness must actually invoke its declared subject.
      # dry-run-install.sh was once labelled the installer's harness while
      # invoking it zero times, producing zero installer coverage beside three
      # green gates and five real defects (5e5150b).
      - name: "Gate 6/7: verify-harness-integrity.py (harnesses invoke subjects)"
        run: python3 tools/verify-harness-integrity.py

      - name: "Gate: verify-router-links.py (head routes every non-head skill)"
        run: python3 tools/verify-router-links.py

      - name: "Gate: verify-mutation-artifact.py (Class 1 mutation-test link)"
        run: python3 tools/verify-mutation-artifact.py

      - name: "Gate: verify-lane-contracts.py (lane contracts are executable)"
        run: python3 tools/verify-lane-contracts.py

      - name: "Gate: verify-shipped-vs-active.py (Class 3 shipped vs wired)"
        run: python3 tools/verify-shipped-vs-active.py

      - name: "Gate: verify-proof-vocab.py (Class 4 cited completion words)"
        run: python3 tools/verify-proof-vocab.py

      - name: "Gate: verify-counts.py (Class 2 hardcoded counts vs live tree)"
        run: python3 tools/verify-counts.py

      # Gauge board. Exits non-zero while any gauge is unmet or its evidence
      # does not resolve, so an unmet gauge cannot be reported as a pass. This
      # gate is EXPECTED to fail until the v3 lanes land — continue-on-error
      # keeps it visible and advisory without blocking unrelated work, and it
      # must be flipped to blocking before the v3.0.0 tag.
      - name: "Gate 7/7: gauge-report.py (advisory until v3 lanes land)"
        continue-on-error: true
        run: python3 tools/gauge-report.py
